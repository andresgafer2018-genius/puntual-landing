name: Puntual Outreach Diario

on:
  schedule:
    # Lunes a viernes, 1 mail por corrida, cerca de las 9, 11, 13, 15 y 17 h de Argentina.
    # (Los horarios están en UTC = Argentina + 3 h. Los minutos van corridos a propósito
    # para no caer en la hora en punto, cuando GitHub está más cargado.)
    # Si GitHub demora y dos corridas caen juntas, el script se saltea la segunda.
    - cron: "7 12 * * 1-5"
    - cron: "13 14 * * 1-5"
    - cron: "4 16 * * 1-5"
    - cron: "11 18 * * 1-5"
    - cron: "9 20 * * 1-5"
  workflow_dispatch:
    inputs:
      email_prueba:
        description: "Modo prueba: manda las 4 versiones del mail a esta dirección (no a escuelas). Dejar vacío para envío real."
        required: false
        default: ""
      cantidad:
        description: "Envío real manual: cantidad de mails a mandar ahora (vacío = 1, respetando el tope diario)"
        required: false
        default: ""

# Evita que dos corridas se pisen
concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: outreach
        run: npm install --no-audit --no-fund

      - name: Enviar emails
        working-directory: outreach
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_EMAILS_POR_DIA: ${{ vars.MAX_EMAILS_POR_DIA }}
          EMAIL_PRUEBA: ${{ inputs.email_prueba }}
          CANTIDAD: ${{ inputs.cantidad }}
        run: node outreach.js
