name: Puntual Outreach Diario

on:
  schedule:
    # Lunes a viernes, 9:00 AM Argentina (12:00 UTC).
    # GitHub puede demorar los workflows programados un par de horas.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      email_prueba:
        description: "Modo prueba: genera UN mail y lo manda a esta dirección (no a la escuela). Dejar vacío para envío real."
        required: false
        default: ""
      cantidad:
        description: "Envío real: cantidad de mails (vacío = usar la variable MAX_EMAILS_POR_DIA)"
        required: false
        default: ""

# Evita que dos corridas se pisen
concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: outreach
        run: npm install --no-audit --no-fund

      - name: Enviar emails
        working-directory: outreach
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_EMAILS_POR_DIA: ${{ vars.MAX_EMAILS_POR_DIA }}
          EMAIL_PRUEBA: ${{ inputs.email_prueba }}
          CANTIDAD: ${{ inputs.cantidad }}
        run: node outreach.js
